name: CI/CD Pipeline (Docker on EC2)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci:
    name: Build & Type-Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type-Check (TypeScript)
        run: npm run lint

      - name: Build Next.js Application
        run: npm run build

  deploy-ec2:
    name: Deploy Docker Container to EC2
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 Host Key to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H -t rsa,ed25519 ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Code to EC2 Server
        run: |
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='public/uploads' \
            --exclude='storage' \
            ./ ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/var/www/synccaster/

      - name: Execute Remote Docker Deployment Script
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "bash /var/www/synccaster/scripts/ec2-deploy.sh /var/www/synccaster"

